services:
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # The Colyseus server runs on the host (via `npm run dev:server`), not
    # in a container — Prometheus reaches it through host.docker.internal.
    # extra_hosts is a no-op on Docker Desktop (macOS/Windows already
    # provide this hostname) but required on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      # Local dev only — skips the forced password-change flow on first
      # admin/admin login. Do not carry this into a real deployment.
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
