# Netlify Configuration for Motion Platform
# Builds and deploys: host + all games

[build]
  # Build all frontend components (host + games)
  command = "./netlify-build.sh"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Railway backend URL is set in Netlify dashboard environment variables
  # VITE_MULTIPLAYER_SERVER_URL will be loaded from dashboard settings

# Build host and all games
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Custom headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=*, microphone=(), geolocation=()"
    # CORS for Module Federation
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache MediaPipe models
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    Content-Type = "application/wasm"

# Game manifests and remoteEntry files should be cached but revalidated
[[headers]]
  for = "/games/*/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/games/*/assets/remoteEntry.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
